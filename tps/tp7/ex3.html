<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>TP7 - Exo 3 : Contrôle Rectangle</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        canvas {
            border: 1px solid #000;
            background: #fff;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <h1> <a href="../../index.html" style="color:var(--accent-color); text-decoration:none;">Portf.</a> /
                    TP7
                </h1>
            </div>
            <nav>
                <ul>
                    <li><a href="../../index.html">← Retour Accueil</a></li>
                    <li><a href="ex1.html">Exo 1 (Figures)</a></li>
                    <li><a href="ex3.html" class="active">Exo 3 (Rectangle)</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <div class="exercise-container">
                <h1>TP7 - Exercice 3 : Contrôle Rectangle</h1>

                <canvas id="myCanvas" width="300" height="300"></canvas>

                <div class="controls">
                    <button class="btn" onclick="changeWidth()">Largeur</button>
                    <button class="btn" onclick="changeHeight()">Hauteur</button>
                    <button class="btn" onclick="changeColor()">Couleur</button>
                    <button class="btn" onclick="changeStyle()">Style</button>
                    <button class="btn" onclick="toggleVisibility()">Visibilité</button>
                </div>

                <div class="exercise-meta">
                    <div class="meta-block">
                        <h4>Technique</h4>
                        <p>Interaction DOM/Canvas. Gestion d'états (w, h, color, fill/stroke).</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        // État initial
        let rectState = {
            x: 50, y: 50,
            w: 50, h: 50,
            colorIndex: 0,
            colors: ['yellow', 'red', 'blue', 'green'],
            isFilled: true,
            isVisible: true
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Nettoyer

            if (!rectState.isVisible) return;

            const currentColor = rectState.colors[rectState.colorIndex];

            if (rectState.isFilled) {
                ctx.fillStyle = currentColor;
                ctx.fillRect(rectState.x, rectState.y, rectState.w, rectState.h);
            } else {
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = 2;
                ctx.strokeRect(rectState.x, rectState.y, rectState.w, rectState.h);
            }
        }

        // Init
        draw();

        // Actions
        function changeWidth() {
            rectState.w += 10;
            if (rectState.w > 200) rectState.w = 10;
            draw();
        }

        function changeHeight() {
            rectState.h += 10;
            if (rectState.h > 200) rectState.h = 10;
            draw();
        }

        function changeColor() {
            rectState.colorIndex = (rectState.colorIndex + 1) % rectState.colors.length;
            draw();
        }

        function changeStyle() {
            rectState.isFilled = !rectState.isFilled;
            draw();
        }

        function toggleVisibility() {
            rectState.isVisible = !rectState.isVisible;
            draw();
        }
    </script>
</body>

</html>
